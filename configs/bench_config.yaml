# Project 1 - LLM Inference Engine Benchmark
#
# Single source of truth for benchmark configuration (documentation/reference;
# runtime values come from the matching env vars in run_all.sh).

# Model to serve (must fit in 24GB VRAM for RTX 4090 / A10G)
MODEL: "meta-llama/Meta-Llama-3-8B-Instruct"
# Smaller fallback if the above is gated / too slow to download
MODEL_FALLBACK: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"

# HF access for gated models (e.g. Llama-3): run `huggingface-cli login` once
# on the pod. The token file is shared by all engine venvs.

# GPU target: RTX 4090 24GB (RunPod). Confirmed pod stack:
#   driver 580.126.20 / CUDA 13.0, Python 3.12.3.
# Engines install into per-engine venvs (venvs/<engine>), never touching the
# pod template's preinstalled torch. See README "How it works".
GPU_TYPE: "RTX 4090 24GB"

# Server ports (each engine runs one at a time)
PORT: 8000

# Benchmark sweep
CONCURRENCY: [1, 2, 4, 8, 16, 32]
OUTPUT_TOKENS: 128
TEMPERATURE: 0.0   # greedy for reproducibility

# Prompt length categories (input token count target)
PROMPT_LENS: [32, 128, 512, 2048]

# Number of unique prompts per (concurrency, prompt_len) cell.
# Must be >= max concurrency so the top of the sweep is meaningful.
PROMPTS_PER_CELL: 40

# Engine install pins (installed into venvs/<engine> by run_all.sh).
# Overridable via env: VLLM_PIN, SGLANG_PIN, TGI_PIN.
VLLM_PIN: "vllm==0.8.5.post1"
VLLM_TORCH: "torch==2.6.0"   # cu126 index — see run_all.sh
SGLANG_PIN: "sglang[all]"
TGI_PIN: "text-generation-inference"
