# Project 1 - LLM Inference Engine Benchmark
#
# Single source of truth for benchmark configuration.
# Edit values here; run_all.sh and bench_client.py both read this file.

# Model to serve (must fit in 24GB VRAM for RTX 4090 / A10G)
MODEL: "meta-llama/Meta-Llama-3-8B-Instruct"
# Smaller fallback if the above is gated / too slow to download
MODEL_FALLBACK: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"

# HF token (set as env var on RunPod: export HF_TOKEN=...)
# Required for Llama-3 gated access.

# GPU selection for RunPod (RTX 4090 = cheapest 24GB)
GPU_TYPE: "RTX 4090"
CUDA_VERSION: "12.4.0"
PYTORCH_VERSION: "2.5.1"

# Server ports (each engine runs one at a time)
PORT: 8000

# Benchmark sweep
CONCURRENCY: [1, 2, 4, 8, 16, 32]
OUTPUT_TOKENS: 128
TEMPERATURE: 0.0   # greedy for reproducibility

# Prompt length categories (input token count target)
PROMPT_LENS: [32, 128, 512, 2048]

# Number of unique prompts per (concurrency, prompt_len) cell
PROMPTS_PER_CELL: 20

# vLLM-specific
VLLM_VERSION: "0.8.5.post1"
VLLM_EXTRA_ARGS: "--gpu-memory-utilization 0.9 --max-model-len 4096"

# SGLang-specific
SGLANG_VERSION: "latest"
SGLANG_EXTRA_ARGS: "--mem-fraction-static 0.9 --context-length 4096"

# TGI-specific
TGI_VERSION: "latest"
TGI_EXTRA_ARGS: "--max-total-tokens 4096 --max-batch-size 256"
